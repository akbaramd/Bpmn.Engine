  postgres:
    image: postgres:15-alpine3.23
    container_name: novin-postgres
    environment:
      POSTGRES_DB: bpmn
      POSTGRES_USER: bpmn
      POSTGRES_PASSWORD: bpmn_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpmn -d bpmn"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

